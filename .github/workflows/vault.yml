name: Vault

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  judge:
    if: startsWith(github.event.issue.title, 'vault')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Untrusted issue data is only ever passed through env vars.
      - name: Judge attempt
        run: python3 scripts/vault.py
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
          VAULT_KEY: ${{ secrets.VAULT_KEY }}

      - name: Reply and close
        run: |
          gh issue comment "$NUMBER" --body-file vault-reply.md
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}

      - name: Re-render the vault
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vault.json README.md assets/live
          git diff --cached --quiet && exit 0
          git commit -m "vault: attempt logged"
          git pull --rebase && git push
