<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 300" width="100%" height="auto">
  <defs>
    <linearGradient id="aboutBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="685" height="300" rx="14" fill="#080B10" stroke="url(#aboutBorder)" stroke-width="1.2" />

  <!-- Top Header Section -->
  <g transform="translate(36, 42)">
    <!-- User Icon in gold -->
    <path d="M14 16v-2a4 4 0 0 0-4-4H4a4 4 0 0 0-4 4v2 M5 6a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -6)" />
    <text x="32" y="2" fill="#F0F6FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="700" letter-spacing="0.5">
      About Me
    </text>
  </g>

  <!-- Left Futuristic Hexagon Badge -->
  <g transform="translate(36, 92)">
    <rect width="46" height="46" rx="10" fill="#121720" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" />
    <path d="M23 11 L35 18 V32 L23 39 L11 32 V18 Z" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="23" cy="25" r="3.5" fill="#D4AF37" />
  </g>

  <!-- Bio Text -->
  <g>
    <text x="100" y="100" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">I&apos;m a CSE student passionate about cybersecurity,</text>
<text x="100" y="124" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">software development, and emerging technologies. I</text>
<text x="100" y="148" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">enjoy building practical solutions, learning new</text>
<text x="100" y="172" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">things, and exploring the intersection of security,</text>
<text x="100" y="196" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">AI, and real-world impact.</text>

  </g>

  <!-- CTA Button: More about me → -->
  <g transform="translate(36, 230)">
    <rect width="180" height="42" rx="21" fill="#121720" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.7" />
    <text x="90" y="26" text-anchor="middle" fill="#F2D06B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.5">
      More about me →
    </text>
  </g>
</svg>