    <path d="M19 8 L29 14 V26 L19 32 L9 26 V14 Z" fill="none" stroke="#D4AF37" stroke-width="1.3" />
    <circle cx="19" cy="20" r="2.8" fill="#D4AF37" />
  </g>

  <!-- Bio Text -->
  <g>
    <text x="74" y="80" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" letter-spacing="0.2">I&apos;m a CSE student passionate about</text>
<text x="74" y="99" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" letter-spacing="0.2">cybersecurity, software development, and</text>
<text x="74" y="118" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" letter-spacing="0.2">emerging technologies. I enjoy building</text>
<text x="74" y="137" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" letter-spacing="0.2">practical solutions, learning new things,</text>
<text x="74" y="156" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" letter-spacing="0.2">and exploring the intersection of</text>
<text x="74" y="175" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" letter-spacing="0.2">security, AI, and real-world impact.</text>

