    <text x="72.5" y="21" text-anchor="middle" fill="#F2D06B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4">
